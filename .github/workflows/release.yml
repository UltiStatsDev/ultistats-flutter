name: Build & Release APK

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v3
        with: 
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with: 
          flutter-version: '3.41.6' 
          cache: true

      - name: Extract version from pubspec.yaml
        id: pubspec_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run build runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
        
      - name: Create env file
        run: | 
          mkdir -p env
          echo '${{ secrets.ENV_JSON_PROD }}' > env/env.json

      - name: Build APK
        run: flutter build apk --release --flavor prod --dart-define-from-file=env/env.json

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-prod-release.apk build/app/outputs/flutter-apk/ultistats_v${{ steps.pubspec_version.outputs.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with: 
          files: build/app/outputs/flutter-apk/ultistats_v${{ steps.pubspec_version.outputs.VERSION }}.apk
          tag_name: v${{ steps.pubspec_version.outputs.VERSION }}
          name: Release v${{ steps.pubspec_version.outputs.VERSION }}
          body: |
            Автоматическая сборка из ветки main.
            Версия: ${{ steps.pubspec_version.outputs.VERSION }}
            Flutter: 3.41.6
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
